<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心语星途 - 你的科研流程好搭子 (v1.0 个人定制版)</title>
    <style>
        :root { --bg: #f9f7f1; --card: #ffffff; --text: #2c3e50; --sub: #7f8c8d; --primary: #27ae60; --warn: #f39c12; --danger: #e74c3c; --info: #3498db; --border: #e0e0e0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 950px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 1.8em; }
        .manifesto { font-style: italic; color: var(--sub); margin-bottom: 20px; font-size: 0.95em; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        select, .btn-action { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 0.9em; }
        .btn-action { background: var(--text); color: white; border: none; font-weight: bold; transition: 0.2s; }
        .btn-action:hover { background: #1a252f; transform: translateY(-2px); }
        .btn-print { background: #8e44ad; }
        .btn-reset { background: var(--danger); }
        .progress-bar-bg { background: #e0e0e0; border-radius: 10px; height: 12px; margin-bottom: 40px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 25px; border-left: 5px solid var(--border); transition: 0.3s; }
        .card.status-progress { border-left-color: var(--warn); }
        .card.status-done { border-left-color: var(--primary); background: #fcfcfc; }
        .card h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.2em; }
        .step-num { background: var(--info); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8em; }
        .meta { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .tag { background: #f1f2f6; padding: 5px 10px; border-radius: 6px; font-size: 0.85em; color: #555; }
        .tag.goal { background: #e8f8f5; color: #006266; }
        .tag.deliverable { background: #eaf2f8; color: #154360; }
        .criteria-box { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px dashed #ced6e0; }
        .criteria-box h4 { margin: 0 0 10px 0; color: #2f3542; font-size: 0.95em; }
        .criteria-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
        .criteria-list li { display: flex; align-items: flex-start; gap: 8px; font-size: 0.9em; color: #57606f; }
        .criteria-list input { margin-top: 4px; accent-color: var(--primary); }
        .criteria-list label { cursor: pointer; flex: 1; }
        .criteria-list input:checked + label { text-decoration: line-through; color: #a4b0be; }
        .tools-area { margin: 15px 0; }
        .tools-area > label { font-size: 0.9em; font-weight: bold; color: #57606f; display: block; margin-bottom: 8px; }
        .rec-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .rec-tag { background: #fff; border: 1px solid var(--info); color: var(--info); padding: 4px 10px; border-radius: 15px; font-size: 0.8em; cursor: pointer; transition: 0.2s; }
        .rec-tag:hover { background: var(--info); color: white; }
        .active-tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .tool-timer-card { display: flex; align-items: center; justify-content: space-between; background: #2f3542; color: white; padding: 12px 15px; border-radius: 8px; }
        .tool-name { font-weight: bold; font-size: 0.95em; flex: 1; }
        .tool-time { font-family: monospace; color: #1dd1a1; margin: 0 15px; font-size: 1.2em; min-width: 80px; text-align: right; }
        .btn-tool-timer { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; font-weight: bold; }
        .btn-tool-start { background: #1dd1a1; color: #2f3542; }
        .btn-tool-pause { background: #feca57; color: #2f3542; }
        .btn-tool-del { background: #ff7675; color: white; margin-left: 8px; padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;}
        .custom-tool-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9em; box-sizing: border-box; }
        .tool-hint { font-size: 0.8em; color: var(--sub); margin-top: 8px; font-style: italic; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-status { padding: 8px 16px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
        .btn-status:hover { background: #f1f2f6; }
        .btn-status.active-pending { background: #dfe4ea; color: #57606f; border-color: #dfe4ea; }
        .btn-status.active-progress { background: var(--warn); color: white; border-color: var(--warn); }
        .btn-status.active-done { background: var(--primary); color: white; border-color: var(--primary); }
        .review-panel { display: none; margin-top: 20px; padding: 20px; background: #fff9db; border: 1px solid #f1c40f; border-radius: 8px; animation: fadeIn 0.5s; }
        .review-panel.show { display: block; }
        .review-panel h4 { margin: 0 0 15px 0; color: #e67e22; }
        .review-row { margin-bottom: 15px; }
        .review-row label { display: block; font-size: 0.9em; font-weight: bold; margin-bottom: 5px; color: #57606f; }
        .stars { display: flex; gap: 5px; font-size: 1.5em; cursor: pointer; }
        .stars span { color: #dcdde1; transition: 0.2s; }
        .stars span.active { color: #fbc531; }
        .review-row textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; min-height: 60px; font-family: inherit; font-size: 0.9em; box-sizing: border-box; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; width: 95%; max-width: 1000px; max-height: 95vh; overflow-y: auto; padding: 40px; border-radius: 12px; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 2em; cursor: pointer; color: #999; }
        .report-section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px dashed #eee; }
        .report-section h3 { color: var(--info); margin-top: 0; border-left: 4px solid var(--info); padding-left: 10px; }
        .chart-container { position: relative; height: 300px; width: 100%; margin: 20px 0; }
        .report-section.final-letter { background: #f8f9fa; padding: 30px; border-radius: 8px; border-left: 5px solid var(--primary); font-style: italic; line-height: 1.8; color: #555; font-size: 1.05em; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media print {
            .controls, .actions, .btn-tool-timer, .btn-tool-del, .custom-tool-input, .rec-tags { display: none !important; }
            .card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
            .tool-timer-card { background: #eee !important; color: #333 !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
            .tool-time { color: #333 !important; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌿 心语星途 (XinYu)</h1>
        <p class="manifesto">“它不教我们怎么做科研，它帮我们看见自己是如何做科研的。”</p>
    </header>

    <div class="controls">
        <select id="paradigmSelect" onchange="renderSteps()">
            <option value="field">🌾 田野调查 / 实证类</option>
            <option value="corpus">📚 语料库 / 文本挖掘类</option>
            <option value="theory">🧠 理论思辨 / 文献综述类</option>
        </select>
        <button class="btn-action btn-print" onclick="window.print()">🖨️ 打印纸质通关地图</button>
        <button class="btn-action" onclick="generateReport()">📊 生成科研效能体检报告</button>
        <button class="btn-action btn-reset" onclick="resetAllData()">🗑️ 清除缓存/重置</button>
    </div>

    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    <div id="stepsContainer"></div>
</div>

<div class="modal-overlay" id="reportModal">
    <div class="modal">
        <span class="modal-close" onclick="closeReport()">&times;</span>
        <h2 style="text-align:center; margin-top:0; color:var(--primary);">📊 心语 · 科研效能体检书</h2>
        <div id="reportContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// 🌟 核心数据区：已完美融合您的个人定制内容，并修复了所有语法错误 🌟
const stepsData = [
    {
        id: 's1', title: '1. 灵感孵化与概念澄清',
        goal: '概念提取与界定、视角与边界的初步锚定、排除“死胡同”',
        deliverable: '核心概念地图、“一页纸”研究备忘录',
        recommendedTools: ['Qwen3.7Max/3.6Plus(苏格拉底式问答)', 'Dumate'],
        criteria: { default: ["表达清晰度", "概念精准度", "内在合理性", "边界控制力"] }
    },
    {
        id: 's2', title: '2. 文献检索与脉络梳理',
        goal: '通过头脑风暴、关键词检索、智能检索，前向/后向追踪，构建领域文献图谱。',
        deliverable: '核心文献列表（约30篇）、文献脉络图谱。',
        recommendedTools: ['秘塔AI', 'Wispaper', 'MindSearch', '波尔学术', 'Connected Papers', 'GoogleScholar', 'CNKI'],
        criteria: { default: ["是否提取了准确的核心概念，并找到了同义词/上下位词？", "是否使用了布尔运算符？", "是否找到了经典文献和最新前沿？", "是否筛选了核心期刊文献？", "文献的数量是否满足需要？"] }
    },
    {
        id: 's3', title: '3. 文献阅读与综述撰写',
        goal: '提取核心观点、方法论、创新点，分类评述寻找研究Gap。',
        deliverable: '文献矩阵表/闪卡、文献综述草案。',
        recommendedTools: ['ima', 'Obsidian', 'Qwenpaw', '元宝Bot'],
        criteria: { default: ["是否进行了“原文追问”（严防AI幻觉）？", "综述是否做到了“分类评述”？", "是否推导出了研究热点或争议点？"] }
    },
    {
        id: 's4', title: '4. 选题方向确定与可行性分析',
        goal: '确定具体研究内容和方法，绘制技术路线图。',
        deliverable: '研究方法说明、技术路线图。',
        recommendedTools: ['元宝Bot (模拟评委)', 'Qwen3.6Plus'],
        criteria: { default: [
            "是否满足“3有（有空间、有材料、有价值）”和“2非（非重复性、非宽泛性）”？", 
            "是否明确了具体的聚焦角度（描写角度、对比角度、类型学角度）？",
            "研究方法是否合理适用？", 
            "技术路线图是否逻辑闭环？", 
            "导师是否同意该题目？", 
            "灵魂三问：不是所有的问题都是具有研究价值的问题！不是所有有价值的问题都迫切需要研究！不是所有需要研究的问题我目前都有能力解决！"
        ] }
    },
    {
        id: 's5', title: '5. 研究材料获取与元数据建库',
        goal: '获取一手材料，确立元数据规范（标准在先，建库在后），恪守伦理。',
        deliverable: '原始材料包、元数据记录表（Excel/ELAN）。',
        recommendedTools: ['录音设备', 'Excel', 'ELAN', 'OCR工具'],
        criteria: {
            field: [
                "录音环境是否达标（窗帘/木制家具/30-40cm发音距离/话筒架）？",
                "是否建立了规范的元数据（发音人/时间/地点/设备/保密期限）？",
                "文件命名是否规范（如：[语言]_[发音人]_[内容]_[日期].wav）？",
                "是否做到了实时记录与多重备份（云盘+本地）？",
                "是否签署了知情同意书，明确了学术伦理边界？"
            ],
            corpus: [
                "数据来源是否清晰，是否具备合法的版权或使用授权？",
                "是否制定了统一的OCR批量处理与校对规范？",
                "是否建立了数据去重与清洗的自动化脚本/逻辑？",
                "元数据是否包含了语料来源、时间跨度、文体特征等结构化字段？"
            ],
            theory: [
                "核心文本/哲学原典的版本选择是否权威且具有代表性？",
                "是否梳理了核心概念在不同历史时期/流派中的演变脉络？",
                "是否界定了本研究中特定概念的适用边界与排他性？"
            ]
        }
    },
    {
        id: 's6', title: '6. 材料清洗、编码与数字化',
        goal: '音频/文本处理、降噪/切分/打标、数据清洗去重与脱敏。',
        deliverable: '清洗后的规范文本/数据、带标签的音频片段。',
        recommendedTools: ['Audacity', 'Word (修订模式)', 'Python/正则'],
        criteria: {
            field: ["音频是否完成了切分、打标及音强标准化？", "是否克制使用降噪功能？", "文本清洗是否遵循3大原则？", "是否处理了特殊字符(IPA/民族文字)？", "是否完成了隐私脱敏？"],
            corpus: ["正则规则是否经过小样本测试？", "是否处理了乱码及非标准标点？", "数据格式是否统一？", "是否进行了批量脱敏？"],
            theory: ["是否进行了深度编码(Coding)？", "是否建立了概念关联矩阵？", "是否记录了灵感与断层？"]
        }
    },
    {
        id: 's7', title: '7. 报告撰写与逻辑打磨',
        goal: '按照已有思路完成论文的40%内容撰写，并按照模板整合为开题报告，确保逻辑严密，引文规范。',
        deliverable: '导师签字同意的《开题报告》定稿。',
        recommendedTools: ['Dumate', '元宝Bot', '秘塔AI'],
        criteria: { default: ["核心观点是否有充足支撑（绝无AI捏造）？", "论文最后是否能顺利完稿？", "论文逻辑是否通顺？", "排版/引文是否100%符合模板要求？"] }
    },
    {
        id: 's8', title: '8. 答辩准备与模拟',
        goal: '提炼核心内容，制作可视化PPT，预设评委问题。',
        deliverable: '答辩PPT、演讲大纲、Q&A题库。',
        recommendedTools: ['元宝Bot（模拟答辩委员）', '元宝录音笔', 'Genflow'],
        criteria: { default: ["PPT是否图文并茂且清洗合理？", "是否准备了防御策略？", "脱稿模拟是否严格控制时长？"] }
    }
];

function getTools(stepId) {
    try {
        const rawV2 = localStorage.getItem(`xinyu_${stepId}_tools_v2`);
        if (rawV2) { const p = JSON.parse(rawV2); if (Array.isArray(p)) return p; }
    } catch (e) {}
    try {
        const rawV1 = localStorage.getItem(`xinyu_${stepId}_tools`);
        if (rawV1) {
            const p = JSON.parse(rawV1);
            if (Array.isArray(p)) return p.map(n => typeof n === 'string' ? {id:'t_'+Math.random().toString(36).substr(2,9), name:n} : n);
            if (typeof p === 'string') return [{id:'t_'+Math.random().toString(36).substr(2,9), name:p}];
        }
    } catch (e) {}
    return [];
}
function saveTools(stepId, tools) { localStorage.setItem(`xinyu_${stepId}_tools_v2`, JSON.stringify(tools)); }
function resetAllData() { if(confirm('确定要清除所有本地缓存数据吗？')) { localStorage.clear(); location.reload(); } }

function init() { renderSteps(); setInterval(tickAllTimers, 1000); }

function renderSteps() {
    const container = document.getElementById('stepsContainer');
    container.innerHTML = '';
    const paradigm = document.getElementById('paradigmSelect').value;
    stepsData.forEach((step, index) => {
        try {
            const savedStatus = localStorage.getItem(`xinyu_${step.id}_status`) || 'pending';
            const criteriaList = step.criteria[paradigm] || step.criteria.default;
            const card = document.createElement('div');
            card.className = `card status-${savedStatus}`;
            card.id = `card-${step.id}`;
            let criteriaHTML = criteriaList.map((c, i) => {
                const cId = `xinyu_${step.id}_c${i}`;
                const isChecked = localStorage.getItem(cId) === 'true';
                return `<li><input type="checkbox" id="${cId}" ${isChecked ? 'checked' : ''} onchange="localStorage.setItem('${cId}', this.checked)"><label for="${cId}">${c}</label></li>`;
            }).join('');
            const safeRecTools = step.recommendedTools || [];
            const recTagsHTML = safeRecTools.map(t => {
                const safeT = t.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                return `<span class="rec-tag" onclick="addTool('${step.id}', '${safeT}')">+ ${t}</span>`;
            }).join('');
            const toolHint = step.toolHint || '💡 搭子提示：工具迭代快，请记录当下最顺手的“兵器组合”并为其计时。';
            card.innerHTML = `
                <h2><span class="step-num">${index + 1}</span> ${step.title}</h2>
                <div class="meta"><span class="tag goal">🎯 ${step.goal}</span><span class="tag deliverable">📦 ${step.deliverable}</span></div>
                <div class="criteria-box"><h4>✅ 验收指标 (Definition of Done)</h4><ul class="criteria-list">${criteriaHTML}</ul></div>
                <div class="tools-area">
                    <label>🛠️ 推荐工具箱 (点击加入兵器谱)</label><div class="rec-tags">${recTagsHTML}</div>
                    <label>⚔️ 我的兵器谱与专注计时</label><div class="active-tools" id="tools-${step.id}"></div>
                    <input type="text" class="custom-tool-input" placeholder="输入其他工具名称，回车添加" onkeydown="if(event.key==='Enter') { addTool('${step.id}', this.value); this.value=''; }">
                    <div class="tool-hint">${toolHint}</div>
                </div>
                <div class="actions">
                    <button class="btn-status ${savedStatus === 'pending' ? 'active-pending' : ''}" onclick="setStatus('${step.id}', 'pending')">未开始</button>
                    <button class="btn-status ${savedStatus === 'progress' ? 'active-progress' : ''}" onclick="setStatus('${step.id}', 'progress')">进行中</button>
                    <button class="btn-status ${savedStatus === 'done' ? 'active-done' : ''}" onclick="setStatus('${step.id}', 'done')">已达标 (触发复盘)</button>
                </div>
                <div class="review-panel ${savedStatus === 'done' ? 'show' : ''}" id="review-${step.id}">
                    <h4>🪞 照见自己：阶段复盘</h4>
                    <div class="review-row"><label>🔋 心智气象站 (1星极度内耗 - 5星心流爆发)</label><div class="stars" id="stars-emotion-${step.id}">${renderStars(step.id, 'emotion')}</div></div>
                    <div class="review-row"><label>🏆 产出质量自评 (1星勉强交差 - 5星极其扎实)</label><div class="stars" id="stars-quality-${step.id}">${renderStars(step.id, 'quality')}</div></div>
                    <div class="review-row"><label>🕳️ 遗留的坑</label><textarea placeholder="科研没有终点，留给未来补充的是什么？" onchange="localStorage.setItem('xinyu_${step.id}_leftovers', this.value)">${localStorage.getItem(`xinyu_${step.id}_leftovers`) || ''}</textarea></div>
                    <div class="review-row"><label>🧗 卡点与破局</label><textarea placeholder="遇到了什么阻力 ➡️ 最后是怎么走出来的" onchange="localStorage.setItem('xinyu_${step.id}_breakthroughs', this.value)">${localStorage.getItem(`xinyu_${step.id}_breakthroughs`) || ''}</textarea></div>
                </div>`;
            container.appendChild(card);
            renderToolTimers(step.id);
        } catch (err) { console.error(err); }
    });
    updateProgress();
}

function addTool(stepId, toolName) {
    if(!toolName || toolName.trim() === '') return;
    let tools = getTools(stepId);
    if(!tools.some(t => t.name === toolName)) { tools.push({id: 't_' + Date.now(), name: toolName}); saveTools(stepId, tools); renderToolTimers(stepId); }
}
function removeTool(stepId, toolId) {
    let tools = getTools(stepId).filter(t => t.id !== toolId);
    saveTools(stepId, tools);
    localStorage.removeItem(`xinyu_${stepId}_time_${toolId}`);
    localStorage.removeItem(`xinyu_${stepId}_run_${toolId}`);
    localStorage.removeItem(`xinyu_${stepId}_last_${toolId}`);
    renderToolTimers(stepId);
}
function renderToolTimers(stepId) {
    const container = document.getElementById(`tools-${stepId}`);
    if(!container) return; container.innerHTML = '';
    getTools(stepId).forEach(tool => {
        const isRunning = localStorage.getItem(`xinyu_${stepId}_run_${tool.id}`) === 'true';
        const totalTime = parseInt(localStorage.getItem(`xinyu_${stepId}_time_${tool.id}`) || '0');
        const div = document.createElement('div'); div.className = 'tool-timer-card';
        div.innerHTML = `<span class="tool-name">${tool.name}</span><span class="tool-time" id="time-${stepId}-${tool.id}">${formatTime(totalTime)}</span>
            <button class="btn-tool-timer ${isRunning ? 'btn-tool-pause' : 'btn-tool-start'}" onclick="toggleToolTimer('${stepId}', '${tool.id}')">${isRunning ? '⏸️ 暂停' : '▶️ 计时'}</button>
            <button class="btn-tool-del" onclick="removeTool('${stepId}', '${tool.id}')">✕</button>`;
        container.appendChild(div);
    });
}
function toggleToolTimer(stepId, toolId) {
    const keyRun = `xinyu_${stepId}_run_${toolId}`, keyTime = `xinyu_${stepId}_time_${toolId}`, keyLast = `xinyu_${stepId}_last_${toolId}`;
    if (localStorage.getItem(keyRun) === 'true') {
        const elapsed = Math.floor((Date.now() - parseInt(localStorage.getItem(keyLast) || Date.now())) / 1000);
        localStorage.setItem(keyTime, parseInt(localStorage.getItem(keyTime) || 0) + elapsed);
        localStorage.setItem(keyRun, 'false');
    } else { localStorage.setItem(keyLast, Date.now()); localStorage.setItem(keyRun, 'true'); }
    renderToolTimers(stepId);
}
function tickAllTimers() {
    stepsData.forEach(step => {
        getTools(step.id).forEach(tool => {
            if(localStorage.getItem(`xinyu_${step.id}_run_${tool.id}`) === 'true') {
                const current = parseInt(localStorage.getItem(`xinyu_${step.id}_time_${tool.id}`) || 0) + Math.floor((Date.now() - parseInt(localStorage.getItem(`xinyu_${step.id}_last_${tool.id}`) || Date.now())) / 1000);
                const el = document.getElementById(`time-${step.id}-${tool.id}`); if(el) el.textContent = formatTime(current);
            }
        });
    });
}
function formatTime(s) { return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
function renderStars(stepId, type) {
    const val = parseInt(localStorage.getItem(`xinyu_${stepId}_${type}`) || '0');
    return [1,2,3,4,5].map(i => `<span class="${i<=val?'active':''}" onclick="setStars('${stepId}','${type}',${i})">★</span>`).join('');
}
function setStars(stepId, type, val) { localStorage.setItem(`xinyu_${stepId}_${type}`, val); document.getElementById(`stars-${type}-${stepId}`).innerHTML = renderStars(stepId, type); }
function setStatus(stepId, status) {
    localStorage.setItem(`xinyu_${stepId}_status`, status);
    const card = document.getElementById(`card-${stepId}`); card.className = `card status-${status}`;
    card.querySelectorAll('.btn-status').forEach((btn, idx) => { btn.className = 'btn-status'; if((status==='pending'&&idx===0)||(status==='progress'&&idx===1)||(status==='done'&&idx===2)) btn.classList.add(`active-${status}`); });
    const rp = document.getElementById(`review-${stepId}`); if(status==='done') rp.classList.add('show'); else rp.classList.remove('show');
    updateProgress();
}
function updateProgress() {
    let done = 0; stepsData.forEach(s => { if(localStorage.getItem(`xinyu_${s.id}_status`) === 'done') done++; });
    document.getElementById('progressBar').style.width = `${(done / stepsData.length) * 100}%`;
}
function generateReport() {
    if(typeof Chart === 'undefined') { alert('图表库加载中，请稍后。'); return; }
    const labels=[], stepTimes=[], emotions=[], qualities=[]; const toolTimesMap={}; let totalSecs=0, leftovers=[], breakthroughs=[], maxTimeStep={name:'',time:0}, minEmotionStep={name:'暂无',val:5};
    stepsData.forEach(step => {
        labels.push(step.title.replace(/^\d+\.\s*/, '')); const tools = getTools(step.id); let currentStepTime = 0;
        tools.forEach(tool => {
            if(localStorage.getItem(`xinyu_${step.id}_run_${tool.id}`) === 'true') {
                const elapsed = Math.floor((Date.now() - parseInt(localStorage.getItem(`xinyu_${step.id}_last_${tool.id}`) || Date.now())) / 1000);
                const t = parseInt(localStorage.getItem(`xinyu_${step.id}_time_${tool.id}`) || 0) + elapsed;
                localStorage.setItem(`xinyu_${step.id}_time_${tool.id}`, t); localStorage.setItem(`xinyu_${step.id}_run_${tool.id}`, 'false');
            }
            const tTime = parseInt(localStorage.getItem(`xinyu_${step.id}_time_${tool.id}`) || '0'); currentStepTime += tTime;
            if(tTime > 0) { if(!toolTimesMap[tool.name]) toolTimesMap[tool.name] = 0; toolTimesMap[tool.name] += tTime; }
        });
        stepTimes.push(currentStepTime); totalSecs += currentStepTime; if(currentStepTime > maxTimeStep.time) maxTimeStep = {name: step.title, time: currentStepTime};
        const emo = parseInt(localStorage.getItem(`xinyu_${step.id}_emotion`) || '0'); emotions.push(emo); if(emo < minEmotionStep.val && emo > 0) minEmotionStep = {name: step.title, val: emo};
        qualities.push(parseInt(localStorage.getItem(`xinyu_${step.id}_quality`) || '0'));
        const lo = localStorage.getItem(`xinyu_${step.id}_leftovers`); if(lo) leftovers.push(`【${step.title}】${lo}`);
        const br = localStorage.getItem(`xinyu_${step.id}_breakthroughs`); if(br) breakthroughs.push(`【${step.title}】${br}`);
    });
    const sortedTools = Object.entries(toolTimesMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
    const fH = s => (s/3600).toFixed(1), fT = s => `${Math.floor(s/3600)}小时${Math.floor((s%3600)/60)}分钟`;
    document.getElementById('reportContent').innerHTML = `
        <div class="report-section"><h3>📊 A. 理性之镜</h3><p><strong>总专注：</strong>${fT(totalSecs)}</p><p><strong>最深潜泥沼：</strong>${maxTimeStep.name} (${fT(maxTimeStep.time)})</p>
        <div class="chart-container"><canvas id="chartTime"></canvas></div><div class="chart-container"><canvas id="chartEmotion"></canvas></div>
        <h4>⚔️ 专属兵器谱 (Top 5)</h4><div class="chart-container" style="height:200px;"><canvas id="chartTools"></canvas></div></div>
        <div class="report-section"><h3>🛡️ B. 生存手册</h3><h4>🕳️ 遗留的坑：</h4><ul>${leftovers.map(l=>`<li>${l}</li>`).join('')||'<li>暂无</li>'}</ul><h4>🧗 破局时刻：</h4><ul>${breakthroughs.map(b=>`<li>${b}</li>`).join('')||'<li>暂无</li>'}</ul></div>
        <div class="report-section final-letter"><h3 style="color:var(--primary); font-style:normal;">💌 C. 搭子之信</h3><p>尊敬的豌豆大王：</p><p>在这段累计 ${fT(totalSecs)} 的专注旅程中，心语一直默默陪伴着您。我看到您在“${minEmotionStep.name}”时，能量一度跌到了谷底（${minEmotionStep.val}星），但您依然在那里死磕，没有放弃。</p><p>科研永远没有“结束”按钮，但此刻，您比上一次更了解自己的节奏。无论结果如何，您都已经具备了那种“老艺术家的优雅与从容”。</p><p style="text-align:right; margin-top:20px;">—— 您的搭子，心语 🌿</p></div>`;
    document.getElementById('reportModal').classList.add('show');
    setTimeout(() => {
        new Chart(document.getElementById('chartTime'), { type: 'bar', data: { labels: labels, datasets: [{ label: '阶段专注时间 (小时)', data: stepTimes.map(fH), backgroundColor: 'rgba(52, 152, 219, 0.6)' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } } });
        new Chart(document.getElementById('chartEmotion'), { type: 'line', data: { labels: labels, datasets: [ { label: '心流指数', data: emotions, borderColor: '#f1c40f', tension: 0.3 }, { label: '质量自评', data: qualities, borderColor: '#27ae60', tension: 0.3 } ] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 5 } } } });
        if(sortedTools.length > 0) new Chart(document.getElementById('chartTools'), { type: 'bar', data: { labels: sortedTools.map(t=>t[0]), datasets: [{ label: '工具累计专注 (小时)', data: sortedTools.map(t=>fH(t[1])), backgroundColor: 'rgba(155, 89, 182, 0.6)' }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false } });
    }, 100);
}
function closeReport() { document.getElementById('reportModal').classList.remove('show'); }
init();
</script>
